<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Season MVP Race | COBL x Street 11 Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#0b1330;--muted:#4b5575;--blue:#1b3fd8;--yellow:#ffd60a;--line:#dde2f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b1f;--surface:#0f1633;--text:#f4f6ff;--muted:#a8b2d6;--line:#222c57;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(135deg,rgba(10,31,143,.9),rgba(6,17,107,.94));color:#fff;padding:28px 0 36px}
.hero a{color:#fff;text-decoration:none;font-size:14px;opacity:.85}
.hero h1{font-size:clamp(40px,9vw,72px);line-height:1;margin-top:14px}
.hero h1 span{color:var(--yellow)}
.hero p{margin:8px 0 0;opacity:.9;max-width:560px}
.note{color:var(--muted);font-size:13px;margin:18px 0}
.leader{background:linear-gradient(135deg,#0a1f8f,#06116b);color:#fff;border:4px solid var(--yellow);border-radius:20px;padding:24px;margin:22px 0;text-align:center}
.leader .tag{display:inline-block;background:var(--yellow);color:#0b1330;font-weight:600;font-size:12px;padding:4px 12px;border-radius:99px;letter-spacing:.08em;text-transform:uppercase}
.leader img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--yellow);display:block;margin:14px auto 0}
.leader h2{font-size:clamp(30px,7vw,52px);margin:10px 0 2px}
.leader p{margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}
.stats div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;color:var(--yellow)}
.stats span{font-size:11px;opacity:.85;font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:40px}
.row{display:grid;grid-template-columns:40px 1fr repeat(5,minmax(44px,60px));gap:6px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);border-left:6px solid var(--tc,transparent)}
.row:last-child{border-bottom:0}
.hd{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}
.rk{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--muted)}
.nm b{display:block;line-height:1.2}.nm small{color:var(--muted)}
.v{text-align:center;font-weight:600}
.v.e{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;color:var(--blue)}
@media (prefers-color-scheme:dark){.v.e{color:var(--yellow)}}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:30px 1fr repeat(3,40px);font-size:13px}.row .h2{display:none}.stats{grid-template-columns:repeat(3,1fr)}}
footer{text-align:center;padding:26px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer a{color:inherit}

const TC={1:'#1f9d55',2:'#111111',3:'#9a9a9a',4:'#2563eb',5:'#f97316',6:'#dc2626',7:'#eab308',8:'#6b7280',9:'#0d9488'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const norm=s=>String(s||'').trim().toLowerCase().replace(/^0+(?=\d)/,'');
function match(r){
  for(let i=0;i<P.length;i++){const p=P[i];
    if(r.team&&r.team==='Team '+p.t&&norm(r.num)===norm(p.j))return i;}
  for(let i=0;i<P.length;i++){const p=P[i];
    if((!r.team||r.team==='Team '+p.t)&&r.name&&(norm(r.name)===norm(p.jn)||norm(r.name)===norm(p.n)))return i;}
  return -1;
}
function build(games){
  const agg={};
  for(const g of games)for(const r of g.rows){
    const i=match(r);const k=i>=0?'p'+i:'x'+(r.team||'')+'|'+norm(r.name)+'|'+norm(r.num);
    const a=agg[k]||(agg[k]={i,name:i>=0?P[i].n:r.name,team:i>=0?'Team '+P[i].t:(r.team||''),tc:i>=0?TC[P[i].t]:'',g:0,pts:0,reb:0,ast:0,stl:0,eff:0});
    a.g++;for(const s of ['pts','reb','ast','stl','eff'])a[s]+=+r[s]||0;
  }
  return Object.values(agg).map(a=>({...a,pts:a.pts/a.g,reb:a.reb/a.g,ast:a.ast/a.g,stl:a.stl/a.g,eff:a.eff/a.g}));
}
function render(games){
  const all=build(games);
  if(!all.length){$('out').innerHTML='<div class="empty">The MVP race starts once games are played.<br>Check back after the first games.</div>';return}
  const maxG=Math.max(...all.map(a=>a.g)), minG=Math.max(1,Math.ceil(maxG/2));
  const q=all.filter(a=>a.g>=minG).sort((x,y)=>y.eff-x.eff||y.pts-x.pts).slice(0,10);
  const top=q[0], f=x=>x.toFixed(1);
  const photo=a=>'<img src="photos/'+slug(a.name)+'.jpg" alt="" onerror="this.remove()">';
  let h='<div class="leader"><span class="tag">Current MVP Leader</span>'+photo(top)+'<h2>'+esc(top.name)+'</h2><p>'+esc(top.team)+' &middot; '+top.g+' game'+(top.g===1?'':'s')+'</p><div class="stats"><div><b>'+f(top.eff)+'</b><span>EFF</span></div><div><b>'+f(top.pts)+'</b><span>PTS</span></div><div><b>'+f(top.reb)+'</b><span>REB</span></div><div><b>'+f(top.ast)+'</b><span>AST</span></div><div><b>'+f(top.stl)+'</b><span>STL</span></div><div><b>'+top.g+'</b><span>GP</span></div></div></div>';
  h+='<div class="list"><div class="row hd"><span>#</span><span>Player</span><span class="v">EFF</span><span class="v">PTS</span><span class="v">REB</span><span class="v h2">AST</span><span class="v h2">STL</span></div>';
  q.forEach((a,r)=>{h+='<div class="row" style="--tc:'+(a.tc||'transparent')+'"><span class="rk">'+(r+1)+'</span><span class="nm"><b>'+esc(a.name)+'</b><small>'+esc(a.team)+' &middot; '+a.g+' GP</small><div class="bar"><i style="width:'+Math.max(4,Math.round(a.eff/top.eff*100))+'%"></i></div></span><span class="v e">'+f(a.eff)+'</span><span class="v">'+f(a.pts)+'</span><span class="v">'+f(a.reb)+'</span><span class="v h2">'+f(a.ast)+'</span><span class="v h2">'+f(a.stl)+'</span></div>'});
  $('out').innerHTML=h+'</div>';
  $('note').textContent='Ranked by average efficiency (EFF) per game: points + rebounds + assists + steals + blocks, minus missed shots, missed free throws and turnovers. Players need at least '+minG+' game'+(minG===1?'':'s')+' (half of the most games played) to qualify. All numbers are per-game averages.';
}
fetch('season-stats.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>render(j&&j.games?j.games:[])).catch(()=>render([]));
