<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season Races · COBL × Street 11</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8ecf3;--muted:#8a93a6;--accent:#e11d48;--gold:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(6px);z-index:10}
  .brand{font-weight:700;color:var(--text);text-decoration:none}
  .nav-links a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:600}
  .nav-links a.active,.nav-links a:hover{color:var(--accent)}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  h1{margin:0 0 4px;font-size:26px}
  .sub{color:var(--muted);margin:0 0 28px}
  h2{font-size:20px;margin:32px 0 10px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#12151c;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  tbody tr:last-child td{border-bottom:none}
  .pos{display:inline-block;width:26px;color:var(--muted);font-weight:700}
  .nm{font-weight:700}
  .tm{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .eff{color:var(--gold);font-weight:800}
  .empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="nav">
  <a class="brand" href="index.html">COBL × Street 11</a>
  <div class="nav-links">
    <a href="schedule.html">Schedule</a>
    <a href="results.html">Results</a>
    <a href="standings.html">Standings</a>
    <a href="season.html" class="active">Season Races</a>
    <a href="players.html">Players</a>
  </div>
</div>
<div class="wrap">
  <h1>Season Races</h1>
  <p class="sub">MVP and Rookie of the Season, tallied across all final games.</p>
  <h2>MVP Race</h2>
  <div id="mvpTable">Loading…</div>
  <h2>Rookie Race</h2>
  <div id="rookieTable">Loading…</div>
</div>
<script src="js/livestats-adapter.js"></script>
<script src="js/app.js"></script>
<script src="js/season.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  function table(rows){
    if (!rows.length) return '<div class="empty">No qualifying games yet.</div>';
    return `<table>
      <thead><tr><th>#</th><th>Player</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>EFF</th></tr></thead>
      <tbody>${rows.slice(0,15).map((p,i)=>`
        <tr>
          <td><span class="pos">${i+1}</span></td>
          <td><span class="nm">#${esc(p.number)} ${esc(p.name)}</span><span class="tm">${esc(p.team)}</span></td>
          <td>${p.gp}</td><td>${p.min.toFixed(1)}</td><td>${p.pts}</td>
          <td>${p.reb}</td><td>${p.ast}</td><td class="eff">${p.eff}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }
  try {
    const games = await loadGames();
    const { mvp, rookies } = SeasonRaces.races(games);
    $('mvpTable').innerHTML    = table(mvp);
    $('rookieTable').innerHTML = table(rookies);
  } catch (e) {
    $('mvpTable').innerHTML = $('rookieTable').innerHTML = '<div class="empty">Could not load data.</div>';
  }
})();
</script>
</body>
</html>
