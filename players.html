<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players · COBL × Street 11</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8ecf3;--muted:#8a93a6;--accent:#e11d48;--gold:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(6px);z-index:10}
  .brand{font-weight:700;color:var(--text);text-decoration:none}
  .nav-links a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:600}
  .nav-links a.active,.nav-links a:hover{color:var(--accent)}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  h1{margin:0 0 4px;font-size:26px}
  .sub{color:var(--muted);margin:0 0 22px}
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .filters input,.filters select{background:#0b0d11;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;font:inherit}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
  .pcard:hover{transform:translateY(-2px);border-color:var(--accent)}
  .pcard .head{aspect-ratio:1;background:#12151c;overflow:hidden;position:relative}
  .pcard .head img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:42px;font-weight:800;background:linear-gradient(135deg,#1a1e28,#12151c)}
  .pcard .rookie{position:absolute;top:10px;left:10px;background:var(--gold);color:#0b1330;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
  .pcard .body{padding:12px 14px}
  .pcard .num{font-family:monospace;color:var(--accent);font-weight:800;font-size:13px}
  .pcard .nm{font-weight:800;font-size:16px;margin:2px 0}
  .pcard .tm{color:var(--muted);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="nav">
  <a class="brand" href="index.html">COBL × Street 11</a>
  <div class="nav-links">
    <a href="schedule.html">Schedule</a>
    <a href="results.html">Results</a>
    <a href="standings.html">Standings</a>
    <a href="season.html">Season Races</a>
    <a href="players.html" class="active">Players</a>
  </div>
</div>
<div class="wrap">
  <h1>Players</h1>
  <p class="sub">Season profiles — photos, team, and stats update as games are uploaded.</p>
  <div class="filters">
    <input id="search" type="search" placeholder="Search name…">
    <select id="teamFilter"><option value="">All teams</option></select>
  </div>
  <div id="grid" class="grid">Loading…</div>
</div>
<script src="js/livestats-adapter.js"></script>
<script src="js/app.js"></script>
<script src="js/season.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let players = {}, games = [], season = { mvp: [], rookies: [] };
  try {
    const [pRes, g] = await Promise.all([fetch('data/players.json', { cache: 'no-store' }), loadGames()]);
    if (pRes.ok) players = await pRes.json();
    games = g;
    season = SeasonRaces.races(games);
  } catch (e) {
    $('grid').innerHTML = '<div class="empty">Could not load player data.</div>';
    return;
  }

  const statsByKey = {};
  for (const row of [...season.mvp, ...season.rookies]) statsByKey[`${row.team}::${row.number}`] = row;

  const entries = Object.entries(players).map(([id, p]) => ({ id, ...p }));
  if (!entries.length){
    $('grid').innerHTML = '<div class="empty">No players in <code>data/players.json</code> yet.</div>';
    return;
  }

  const teams = [...new Set(entries.map(p => p.team))].sort();
  $('teamFilter').innerHTML = '<option value="">All teams</option>' +
    teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');

  function render(){
    const q = $('search').value.trim().toLowerCase();
    const team = $('teamFilter').value;
    const filtered = entries.filter(p =>
      (!q || (p.name||'').toLowerCase().includes(q)) &&
      (!team || p.team === team));
    if (!filtered.length){ $('grid').innerHTML = '<div class="empty">No players match.</div>'; return; }
    $('grid').innerHTML = filtered.map(p => {
      const stat = statsByKey[`${p.team}::${p.number}`];
      const photo = p.photo
        ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy">`
        : `<div class="placeholder">#${esc(p.number)}</div>`;
      return `<div class="pcard">
        <div class="head">${photo}${p.rookie ? '<span class="rookie">Rookie</span>' : ''}</div>
        <div class="body">
          <div class="num">#${esc(p.number)}</div>
          <div class="nm">${esc(p.name)}</div>
          <div class="tm">${esc(p.team)}</div>
          ${stat ? `<div class="tm" style="margin-top:6px">${stat.gp} GP · ${stat.pts} PTS · ${stat.eff} EFF</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  $('search').addEventListener('input', render);
  $('teamFilter').addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
