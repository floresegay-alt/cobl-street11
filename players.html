<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Players | COBL x Street 11 Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#0b1330;--muted:#4b5575;--blue:#1b3fd8;--yellow:#ffd60a;--line:#dde2f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b1f;--surface:#0f1633;--text:#f4f6ff;--muted:#a8b2d6;--line:#222c57;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
.hero{background:linear-gradient(135deg,#0a1f8f,#06116b);color:#fff;padding:28px 0 36px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hero a{color:#fff;text-decoration:none;font-size:14px;opacity:.85}
.hero h1{font-size:clamp(40px,9vw,72px);line-height:1;margin-top:14px}
.hero h1 span{color:var(--yellow)}
.hero p{margin:8px 0 0;opacity:.9}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 14px}
.tools input,.tools select{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-width:0}
.tools input{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.6);display:inline-block}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.count{color:var(--muted);font-size:14px;margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:50px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:14px;align-items:center}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.num{font-family:Anton,Impact,sans-serif;font-size:36px;line-height:1;min-width:54px;text-align:center;color:var(--blue)}
@media (prefers-color-scheme:dark){.num{color:var(--yellow)}}
.card b{display:block;font-size:15px;line-height:1.25}
.card small{color:var(--muted);font-size:12px}
.pos{display:inline-block;background:var(--yellow);color:#0b1330;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600;margin-right:6px}
.empty{padding:50px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:0;max-width:380px;width:92%;background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.m{padding:28px 24px;text-align:center;border-top:10px solid var(--tc)}
.m .big{font-family:Anton,Impact,sans-serif;font-size:84px;line-height:1;color:var(--blue)}
@media (prefers-color-scheme:dark){.m .big{color:var(--yellow)}}
.m h2{font-size:28px;margin:6px 0}
.m p{margin:4px 0;color:var(--muted)}
.m button{margin-top:18px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 26px;font:inherit;font-weight:600;cursor:pointer}
.avg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px}
.avg div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 2px}
.avg b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;color:var(--blue)}
@media (prefers-color-scheme:dark){.avg b{color:var(--yellow)}}
.avg span{font-size:11px;color:var(--muted);font-weight:600}
.avt{margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ph{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--line)}
.card small.ppg{display:block;margin-top:2px;font-weight:600;color:var(--text);font-size:12px}
.mph{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--tc);margin-bottom:6px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:22px 0 4px}
.lead h2{font-size:26px;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.tabs button.on{background:var(--yellow);color:#0b1330;border-color:var(--yellow)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.row:last-child{border-bottom:0}
.rk{font-family:Anton,Impact,sans-serif;font-size:20px;width:26px;color:var(--muted)}
.row span.nm{flex:1;font-weight:600}.row small{color:var(--muted);font-weight:400;margin-left:6px}
.row b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;color:var(--blue)}
@media (prefers-color-scheme:dark){.row b{color:var(--yellow)}}
.adm{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:14px 0;font-size:13px}
.adm code{display:block;word-break:break-all}
footer{text-align:center;padding:26px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer a{color:inherit}
</style>
</head>

  if(!a)return '<div class="avt">Season averages</div><p>Stats will appear after games are played.</p>';
  const f=x=>x.toFixed(1);
  return '<div class="avt">Season averages &middot; '+a.g+' game'+(a.g===1?'':'s')+'</div><div class="avg"><div><b>'+f(a.pts)+'</b><span>PTS</span></div><div><b>'+f(a.reb)+'</b><span>REB</span></div><div><b>'+f(a.ast)+'</b><span>AST</span></div><div><b>'+f(a.stl)+'</b><span>STL</span></div><div><b>'+f(a.eff)+'</b><span>EFF</span></div></div>';
}
$('dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
let ls='pts';
const LS={pts:'PTS',reb:'REB',ast:'AST',stl:'STL',eff:'EFF'};
function leaders(){
  const all=P.map((p,i)=>({i,a:avgs(p)})).filter(x=>x.a);
  $('lead').hidden=!all.length;
  if(!all.length)return;
  $('tabs').innerHTML=Object.keys(LS).map(k=>'<button data-k="'+k+'"'+(k===ls?' class="on"':'')+'>'+LS[k]+'</button>').join('');
  all.sort((x,y)=>y.a[ls]-x.a[ls]);
  $('rows').innerHTML=all.slice(0,5).map((x,r)=>{const p=P[x.i];return '<button class="row" data-i="'+x.i+'"><span class="rk">'+(r+1)+'</span><span class="nm">'+esc(p.n)+'<small>Team '+p.t+' &middot; #'+esc(p.j)+'</small></span><b>'+x.a[ls].toFixed(1)+'</b></button>'}).join('');
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;ls=b.dataset.k;leaders()};
$('rows').onclick=e=>{const b=e.target.closest('.row');if(b)$('grid').onclick({target:{closest:()=>({dataset:{i:b.dataset.i}})}})};
if(location.search.includes('photos'))$('adm').innerHTML='<div class="adm"><b>Photo file names</b> (save each photo as .jpg in a <code style="display:inline">photos</code> folder in the repo):'+P.map(p=>'<code>photos/'+slug(p.n)+'.jpg</code>').join('')+'</div>';
chips();list();
</script>
</body>
</html>
