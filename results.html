<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Summary & Results · COBL x Street 11 Basketball</title>
<meta property="og:title" content="Game Summary & Results · COBL x Street 11 Basketball">
<meta property="og:description" content="Final scores, player stats, and full recaps for COBL x Street 11 Season 3.">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#0b1330;--muted:#4b5575;--blue:#1b3fd8;--yellow:#ffd60a;--line:#dde2f0;--green:#15803d;--pog:#f59e0b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b1f;--surface:#0f1633;--text:#f4f6ff;--muted:#a8b2d6;--line:#222c57;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;flex-wrap:wrap;gap:10px}
nav .links a{text-decoration:none;font-size:14px;margin-left:14px;opacity:.85}
nav .links a:hover,nav .links a.on{opacity:1;text-decoration:underline}
.hero{background:linear-gradient(135deg,rgba(10,31,143,.95),rgba(6,17,107,.97));color:#fff;padding:36px 0 44px}
.hero h1{font-size:clamp(32px,7vw,56px);line-height:1;margin:10px 0 8px}
.hero h1 span{color:var(--yellow)}
.tag{display:inline-block;background:var(--yellow);color:#0b1330;font-weight:600;font-size:12px;padding:4px 12px;border-radius:99px;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
.tabs button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 16px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}
.tools select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.scoreline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.team{flex:1 1 120px;font-weight:600}.team.right{text-align:right}
.score{font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--blue);white-space:nowrap}
@media (prefers-color-scheme:dark){.score{color:var(--yellow)}}
.winner{color:var(--green);font-size:13px;font-weight:600}
.pog-banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0 16px;padding:14px 16px;border-radius:12px;border:2px solid var(--pog);background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(27,63,216,.08))}
.pog-banner .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b45309}
.pog-banner .name{font-family:Anton,Impact,sans-serif;font-size:24px;line-height:1}
.pog-banner .stats{font-size:14px;font-weight:600}
.pog-star{font-size:22px}
.bs-wrap{overflow-x:auto;margin:10px 0 16px}
.bs-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;color:var(--muted)}
table.bs{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
table.bs th{text-align:center;padding:7px 6px;background:var(--bg);color:var(--muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--line)}
table.bs th.name,table.bs td.name{text-align:left}
table.bs td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.bs tr.pog-row{background:rgba(245,158,11,.18)}
table.bs tr.pog-row td{font-weight:700}
table.bs tr.pog-row td.name::after{content:" ★ POG";color:#b45309;font-size:10px;font-weight:800;margin-left:6px}
.narrative p{margin:0 0 12px;font-size:15px;line-height:1.65}
.res-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.res-row:last-child{border-bottom:0}
.res-team{font-weight:600;font-size:14px}.res-team.w{color:var(--green)}
.res-score{font-family:Anton,Impact,sans-serif;font-size:26px;text-align:center;min-width:90px}
.res-date{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.res-pog{grid-column:1/-1;font-size:12px;color:#b45309;font-weight:600}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span style="font-family:Anton,Impact,sans-serif"><a href="index.html" style="text-decoration:none">COBL × Street 11</a></span>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="standings.html">Standings</a>
      <a href="results.html" class="on">Results</a>
      <a href="players.html">Players</a>
      <a href="mvp.html">MVP Race</a>
    </div>
  </nav>
</div>
<header class="hero">
  <div class="wrap">
    <span class="tag">Season 3</span>
    <h1>Game Summary <span>& Results</span></h1>
    <p style="opacity:.9;max-width:560px;margin:0">Final scores, team player stats, and full recaps — Player of the Game highlighted on every result.</p>
  </div>
</header>
<section class="wrap" style="padding:24px 0 40px">
  <div class="tabs">
    <button type="button" class="on" data-tab="results">Results</button>
    <button type="button" data-tab="summaries">Game Summaries</button>
  </div>
  <div class="tools">
    <select id="teamFilter" aria-label="Filter by team"><option value="">All teams</option></select>
  </div>
  <div id="panel-results" class="panel on"><div id="resultsList" class="card"><div class="empty">Loading…</div></div></div>
  <div id="panel-summaries" class="panel"><div id="summariesList"><div class="empty">Loading…</div></div></div>
</section>
<footer><div class="wrap">&copy; 2026 COBL Committee · <a href="standings.html">Standings</a></div></footer>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
  let RECAPS=[];
  document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===btn));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
      document.getElementById('panel-'+btn.getAttribute('data-tab')).classList.add('on');
    });
  });
  function filtered(){
    const f=document.getElementById('teamFilter').value;
    if(!f) return RECAPS.slice();
    return RECAPS.filter(r=>String(r.teamA).includes(f)||String(r.teamB).includes(f)||String(r.winner).includes(f));
  }
  function isPog(r,p){
    const pog=r.playerOfGame; if(!pog||!p) return false;
    return String(pog.num)===String(p.num) && String(pog.name).toLowerCase()===String(p.name).toLowerCase();
  }
  function boxTable(r,side,teamName){
    const rows=(r.boxscore&&r.boxscore[side])?r.boxscore[side]:[];
    if(!rows.length){
      const pog=r.playerOfGame;
      if(pog&&pog.team===teamName){
        return '<div class="bs-title">'+esc(teamName)+'</div><div class="bs-wrap"><table class="bs"><thead><tr><th class="name">Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>EFF</th></tr></thead><tbody><tr class="pog-row"><td class="name">#'+esc(pog.num)+' '+esc(pog.name)+'</td><td>'+esc(pog.min!=null?pog.min:'—')+'</td><td>'+esc(pog.pts)+'</td><td>'+esc(pog.reb)+'</td><td>'+esc(pog.ast)+'</td><td>'+esc(pog.stl!=null?pog.stl:'—')+'</td><td>'+esc(pog.blk!=null?pog.blk:'—')+'</td><td>'+esc(pog.eff)+'</td></tr></tbody></table></div>';
      }
      return '<div class="bs-title">'+esc(teamName)+'</div><p class="meta">Full player stats appear for games published with the updated Live Stats app.</p>';
    }
    let h='<div class="bs-title">'+esc(teamName)+'</div><div class="bs-wrap"><table class="bs"><thead><tr><th class="name">Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>FG</th><th>3PT</th><th>FT</th><th>EFF</th></tr></thead><tbody>';
    rows.forEach(p=>{
      const pog=isPog(r,p);
      h+='<tr class="'+(pog?'pog-row':'')+'"><td class="name">#'+esc(p.num)+' '+esc(p.name)+'</td><td>'+esc(p.min)+'</td><td>'+esc(p.pts)+'</td><td>'+esc(p.reb)+'</td><td>'+esc(p.ast)+'</td><td>'+esc(p.stl)+'</td><td>'+esc(p.blk)+'</td><td>'+esc(p.to)+'</td><td>'+esc(p.fgm)+'-'+esc(p.fga)+'</td><td>'+esc(p.fgm3)+'-'+esc(p.fga3)+'</td><td>'+esc(p.ftm)+'-'+esc(p.fta)+'</td><td>'+esc(p.eff)+'</td></tr>';
    });
    return h+'</tbody></table></div>';
  }
  function pogBanner(r){
    const pog=r.playerOfGame; if(!pog) return '';
    return '<div class="pog-banner"><span class="pog-star">★</span><div><div class="label">Player of the Game</div><div class="name">#'+esc(pog.num)+' '+esc(pog.name)+'</div><div class="meta" style="margin:0">'+esc(pog.team)+'</div></div><div class="stats">'+esc(pog.pts)+' PTS · '+esc(pog.reb)+' REB · '+esc(pog.ast)+' AST · '+esc(pog.eff)+' EFF</div></div>';
  }
  function renderResults(){
    const list=filtered().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const el=document.getElementById('resultsList');
    if(!list.length){el.innerHTML='<div class="empty">No results yet.</div>';return;}
    el.innerHTML=list.map(r=>{
      const wA=r.winner&&r.winner===r.teamA, wB=r.winner&&r.winner===r.teamB;
      const pog=r.playerOfGame?('<div class="res-pog">★ POG: #'+esc(r.playerOfGame.num)+' '+esc(r.playerOfGame.name)+' ('+esc(r.playerOfGame.team)+') — '+esc(r.playerOfGame.pts)+' PTS · '+esc(r.playerOfGame.eff)+' EFF</div>'):'';
      return '<div class="res-row"><div class="res-date">'+esc(r.dateLabel||r.date||'')+'</div><div class="res-team'+(wA?' w':'')+'">'+esc(r.teamA)+(wA?' ✓':'')+'</div><div class="res-score">'+esc(r.scoreA)+' – '+esc(r.scoreB)+'</div><div class="res-team'+(wB?' w':'')+'" style="text-align:right">'+esc(r.teamB)+(wB?' ✓':'')+'</div>'+pog+'</div>';
    }).join('');
  }
  function renderSummaries(){
    const list=filtered().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const el=document.getElementById('summariesList');
    if(!list.length){el.innerHTML='<div class="empty">No summaries yet.</div>';return;}
    el.innerHTML=list.map(r=>{
      const paras=(r.narrative&&r.narrative.length)?r.narrative.map(p=>'<p>'+esc(p)+'</p>').join(''):(r.text?'<p>'+esc(r.text).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>':'');
      return '<article class="card"><div class="meta">'+esc(r.dateLabel||r.date||'')+(r.winner?' · <span class="winner">W: '+esc(r.winner)+'</span>':'')+'</div><h2>'+esc(r.teamA)+' vs '+esc(r.teamB)+'</h2><div class="scoreline"><div class="team">'+esc(r.teamA)+'</div><div class="score">'+esc(r.scoreA)+' – '+esc(r.scoreB)+'</div><div class="team right">'+esc(r.teamB)+'</div></div>'+pogBanner(r)+boxTable(r,'A',r.teamA)+boxTable(r,'B',r.teamB)+'<div class="narrative">'+paras+'</div></article>';
    }).join('');
  }
  function renderAll(){renderResults();renderSummaries();}
  document.getElementById('teamFilter').addEventListener('change',renderAll);
  Promise.all([
    fetch('game-recaps.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch('teams.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([j,teams])=>{
    RECAPS=(j&&Array.isArray(j.recaps))?j.recaps:[];
    if(RECAPS.length&&RECAPS[0]&&RECAPS[0].recaps) RECAPS=RECAPS.flatMap(x=>x.recaps||[x]).filter(x=>x&&x.teamA);
    const sel=document.getElementById('teamFilter'); const names=new Set();
    RECAPS.forEach(r=>{if(r.teamA)names.add(r.teamA);if(r.teamB)names.add(r.teamB);});
    if(teams&&teams.teams) teams.teams.forEach(t=>{if(t.name)names.add(t.name);});
    [...names].sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
    renderAll();
  });
})();
</script>
</body>
</html>
