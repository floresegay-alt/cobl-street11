<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Summary & Results · COBL x Street 11 Basketball</title>
<meta property="og:title" content="Game Summary & Results · COBL x Street 11 Basketball">
<meta property="og:description" content="Final scores, player stats, and full game recaps for COBL x Street 11 Season 3.">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#0b1330;--muted:#4b5575;--blue:#1b3fd8;--yellow:#ffd60a;--line:#dde2f0;--green:#15803d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b1f;--surface:#0f1633;--text:#f4f6ff;--muted:#a8b2d6;--line:#222c57;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
a{color:inherit}.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;flex-wrap:wrap;gap:10px}
nav .links a{text-decoration:none;font-size:14px;margin-left:14px;opacity:.85}
nav .links a:hover,nav .links a.on{opacity:1;text-decoration:underline}
.hero{background:linear-gradient(135deg,rgba(10,31,143,.95),rgba(6,17,107,.97));color:#fff;padding:36px 0 44px}
.hero h1{font-size:clamp(32px,7vw,56px);line-height:1;margin:10px 0 8px}.hero h1 span{color:var(--yellow)}
.tag{display:inline-block;background:var(--yellow);color:#0b1330;font-weight:600;font-size:12px;padding:4px 12px;border-radius:99px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
.tabs button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 16px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tools{margin:12px 0 18px}.tools select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:4px}.meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.scoreline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.team{flex:1 1 120px;font-weight:600}.team.right{text-align:right}
.score{font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--blue);white-space:nowrap}
@media (prefers-color-scheme:dark){.score{color:var(--yellow)}}
.winner{color:var(--green);font-size:13px;font-weight:600}
.bs-wrap{overflow-x:auto;margin:10px 0 16px}
.bs-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;color:var(--muted)}
tabletable.bs{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
table.bs th{text-align:center;padding:7px 6px;background:var(--bg);color:var(--muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--line)}
table.bs th.name,table.bs td.name{text-align:left}table.bs td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.bs tr.pog-row{background:rgba(245,158,11,.18)}table.bs tr.pog-row td{font-weight:700}
table.bs tr.pog-row td.name .pog-tag{color:#b45309;font-size:10px;font-weight:800;margin-left:6px}
.narrative p{margin:0 0 12px;font-size:15px;line-height:1.65}
.game-block{border-bottom:1px solid var(--line);padding:16px 0}.game-block:last-child{border-bottom:0}
.res-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:8px}
.res-team{font-weight:600;font-size:14px}.res-team.w{color:var(--green)}
.res-score{font-family:Anton,Impact,sans-serif;font-size:28px;text-align:center;min-width:90px;color:var(--blue)}
@media (prefers-color-scheme:dark){.res-score{color:var(--yellow)}}
.res-date{font-size:12px;color:var(--muted);margin-bottom:6px}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.btn-share{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#1877f2;color:#fff}
.btn-share:hover{filter:brightness(1.08)}.btn-share svg{width:16px;height:16px;fill:currentColor}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
#share-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1877f2;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92%;text-align:center;display:none}
</style>
</head>
<body>
<div class="wrap"><nav><span style="font-family:Anton,Impact,sans-serif"><a href="index.html" style="text-decoration:none">COBL × Street 11</a></span><div class="links"><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="standings.html">Standings</a><a href="results.html" class="on">Results</a><a href="players.html">Players</a><a href="mvp.html">MVP Race</a></div></nav></div>
<header class="hero"><div class="wrap"><span class="tag">Season 3</span><h1>Game Summary <span>&amp; Results</span></h1><p style="opacity:.9;max-width:560px;margin:0">Final scores, player stats, and shareable game recaps.</p></div></header>
<section class="wrap" style="padding:24px 0 40px">
<div class="tabs"><button type="button" class="on" data-tab="results">Results</button><button type="button" data-tab="summaries">Game Summaries</button></div>
<div class="tools"><select id="teamFilter"><option value="">All teams</option></select></div>
<div id="panel-results" class="panel on"><div id="resultsList" class="card"><div class="empty">Loading…</div></div></div>
<div id="panel-summaries" class="panel"><div id="summariesList"><div class="empty">Loading…</div></div></div>
</section>
<footer><div class="wrap">&copy; 2026 COBL Committee</div></footer>
<div id="share-toast" role="status"></div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  let RECAPS=[];
  const FB_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.06C22 6.48 17.52 2 11.94 2S1.88 6.48 1.88 12.06c0 5.01 3.66 9.16 8.44 9.94v-7.03H7.9v-2.91h2.42V9.84c0-2.39 1.42-3.71 3.6-3.71 1.04 0 2.13.19 2.13.19v2.34h-1.2c-1.18 0-1.55.73-1.55 1.48v1.78h2.64l-.42 2.91h-2.22V22c4.78-.78 8.44-4.93 8.44-9.94z"/></svg>';
  function gameShareUrl(r){const base=location.origin+location.pathname.replace(/[^/]*$/,'results.html');const id=r.id||(String(r.teamA||'')+'-vs-'+String(r.teamB||'')+'-'+String(r.date||''));return base+'?tab=summaries&game='+encodeURIComponent(id);}
  function buildShareText(r){
    const link=gameShareUrl(r);const lines=[];
    lines.push('COBL x Street 11 Basketball — Game Summary');
    lines.push((r.dateLabel||r.date||'')+(r.winner?' · W: '+r.winner:''));
    lines.push('');lines.push((r.teamA||'')+'  '+r.scoreA+' – '+r.scoreB+'  '+(r.teamB||''));lines.push('');
    if(r.playerOfGame){const p=r.playerOfGame;lines.push('Player of the Game: #'+p.num+' '+p.name+' ('+p.team+') — '+p.pts+' PTS · '+p.reb+' REB · '+p.ast+' AST · '+p.eff+' EFF');lines.push('');}
    if(r.narrative&&r.narrative.length){r.narrative.forEach(function(p){lines.push(p);lines.push('');});}
    else if(r.text){lines.push(String(r.text));lines.push('');}
    lines.push('Full recap & stats:');lines.push(link);lines.push('');lines.push('#COBL #Street11 #Basketball');
    return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  function facebookShareUrl(url,quote){let u='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);if(quote)u+='&quote='+encodeURIComponent(quote);return u;}
  function showShareToast(msg){const el=document.getElementById('share-toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none';},4500);}
  function shareGameOnFacebook(r){
    const url=gameShareUrl(r);const text=buildShareText(r);
    const openFb=function(){window.open(facebookShareUrl(url,text),'_blank','noopener,width=640,height=520');};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){showShareToast('Full summary copied — paste it into your Facebook post.');openFb();}).catch(function(){openFb();});}
    else openFb();
  }
  document.addEventListener('click',function(e){
    const btn=e.target.closest&&e.target.closest('.btn-share');if(!btn)return;
    const id=btn.getAttribute('data-share-id');let rec=null;
    if(id){rec=RECAPS.find(function(x){const xid=x.id||(String(x.teamA||'')+'-vs-'+String(x.teamB||'')+'-'+String(x.date||''));return xid===id||x.id===id;});}
    if(rec) shareGameOnFacebook(rec);
  });
  document.querySelectorAll('.tabs button').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b===btn);});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});document.getElementById('panel-'+btn.getAttribute('data-tab')).classList.add('on');});});
  function filtered(){const f=document.getElementById('teamFilter').value;if(!f)return RECAPS.slice();return RECAPS.filter(function(r){return String(r.teamA).includes(f)||String(r.teamB).includes(f)||String(r.winner).includes(f);});}
  function isPog(r,p){const pog=r.playerOfGame;if(!pog||!p)return false;return String(pog.num)===String(p.num)&&String(pog.name).toLowerCase()===String(p.name).toLowerCase();}
  function boxTable(r,side,teamName){
    const rows=(r.boxscore&&r.boxscore[side])?r.boxscore[side]:[];
    if(!rows.length){const pog=r.playerOfGame;if(pog&&pog.team===teamName){return '<div class="bs-title">'+esc(teamName)+'</div><div class="bs-wrap"><table class="bs"><thead><tr><th class="name">Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>EFF</th></tr></thead><tbody><tr class="pog-row"><td class="name">#'+esc(pog.num)+' '+esc(pog.name)+' <span class="pog-tag">★ Player of the Game</span></td><td>'+esc(pog.min!=null?pog.min:'—')+'</td><td>'+esc(pog.pts)+'</td><td>'+esc(pog.reb)+'</td><td>'+esc(pog.ast)+'</td><td>'+esc(pog.stl!=null?pog.stl:'—')+'</td><td>'+esc(pog.blk!=null?pog.blk:'—')+'</td><td>'+esc(pog.eff)+'</td></tr></tbody></table></div>';}return '<div class="bs-title">'+esc(teamName)+'</div><p class="meta">Full roster stats appear when published with updated Live Stats.</p>';}
    let h='<div class="bs-title">'+esc(teamName)+'</div><div class="bs-wrap"><table class="bs"><thead><tr><th class="name">Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>FG</th><th>3PT</th><th>FT</th><th>EFF</th></tr></thead><tbody>';
    rows.forEach(function(p){const pog=isPog(r,p);h+='<tr class="'+(pog?'pog-row':'')+'"><td class="name">#'+esc(p.num)+' '+esc(p.name)+(pog?' <span class="pog-tag">★ Player of the Game</span>':'')+'</td><td>'+esc(p.min)+'</td><td>'+esc(p.pts)+'</td><td>'+esc(p.reb)+'</td><td>'+esc(p.ast)+'</td><td>'+esc(p.stl)+'</td><td>'+esc(p.blk)+'</td><td>'+esc(p.to)+'</td><td>'+esc(p.fgm)+'-'+esc(p.fga)+'</td><td>'+esc(p.fgm3)+'-'+esc(p.fga3)+'</td><td>'+esc(p.ftm)+'-'+esc(p.fta)+'</td><td>'+esc(p.eff)+'</td></tr>';});
    return h+'</tbody></table></div>';
  }
  function renderResults(){
    const list=filtered().slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
    const el=document.getElementById('resultsList');
    if(!list.length){el.innerHTML='<div class="empty">No results yet.</div>';return;}
    el.innerHTML=list.map(function(r){const wA=r.winner&&r.winner===r.teamA,wB=r.winner&&r.winner===r.teamB;return '<div class="game-block"><div class="res-date">'+esc(r.dateLabel||r.date||'')+(r.winner?' · <span class="winner">W: '+esc(r.winner)+'</span>':'')+'</div><div class="res-head"><div class="res-team'+(wA?' w':'')+'">'+esc(r.teamA)+(wA?' ✓':'')+'</div><div class="res-score">'+esc(r.scoreA)+' – '+esc(r.scoreB)+'</div><div class="res-team'+(wB?' w':'')+'" style="text-align:right">'+esc(r.teamB)+(wB?' ✓':'')+'</div></div>'+boxTable(r,'A',r.teamA)+boxTable(r,'B',r.teamB)+'</div>';}).join('');
  }
  function renderSummaries(){
    const list=filtered().slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
    const el=document.getElementById('summariesList');
    if(!list.length){el.innerHTML='<div class="empty">No summaries yet.</div>';return;}
    el.innerHTML=list.map(function(r){
      const paras=(r.narrative&&r.narrative.length)?r.narrative.map(function(p){return '<p>'+esc(p)+'</p>';}).join(''):(r.text?'<p>'+esc(r.text).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>':'');
      const sid=r.id||(String(r.teamA||'')+'-vs-'+String(r.teamB||'')+'-'+String(r.date||''));
      return '<article class="card" id="game-'+esc(sid)+'"><div class="meta">'+esc(r.dateLabel||r.date||'')+(r.winner?' · <span class="winner">W: '+esc(r.winner)+'</span>':'')+'</div><h2>'+esc(r.teamA)+' vs '+esc(r.teamB)+'</h2><div class="scoreline"><div class="team">'+esc(r.teamA)+'</div><div class="score">'+esc(r.scoreA)+' – '+esc(r.scoreB)+'</div><div class="team right">'+esc(r.teamB)+'</div></div>'+boxTable(r,'A',r.teamA)+boxTable(r,'B',r.teamB)+'<div class="narrative">'+paras+'</div><div class="share-row"><button type="button" class="btn-share" data-share-id="'+esc(sid)+'">'+FB_ICON+' Share on Facebook</button></div></article>';
    }).join('');
  }
  function renderAll(){renderResults();renderSummaries();}
  function applyDeepLink(){try{const q=new URLSearchParams(location.search);if(q.get('tab')==='summaries'){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')==='summaries');});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});const p=document.getElementById('panel-summaries');if(p)p.classList.add('on');}const game=q.get('game');if(game)setTimeout(function(){const el=document.getElementById('game-'+game);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},350);}catch(e){}}
  document.getElementById('teamFilter').addEventListener('change',renderAll);
  Promise.all([fetch('game-recaps.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),fetch('teams.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})]).then(function(arr){
    const j=arr[0],teams=arr[1];RECAPS=(j&&Array.isArray(j.recaps))?j.recaps:[];
    if(RECAPS.length&&RECAPS[0]&&RECAPS[0].recaps)RECAPS=RECAPS.flatMap(function(x){return x.recaps||[x];}).filter(function(x){return x&&x.teamA;});
    const sel=document.getElementById('teamFilter');const names=new Set();RECAPS.forEach(function(r){if(r.teamA)names.add(r.teamA);if(r.teamB)names.add(r.teamB);});
    if(teams&&teams.teams)teams.teams.forEach(function(t){if(t.name)names.add(t.name);});
    Array.from(names).sort().forEach(function(n){const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
    renderAll();applyDeepLink();
  });
})();
</script>
</body>
</html>
