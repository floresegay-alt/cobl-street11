<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Summary &amp; Results · COBL × Street 11</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8ecf3;--muted:#8a93a6;--accent:#e11d48;--gold:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(6px);z-index:10}
  .brand{font-weight:700;color:var(--text);text-decoration:none}
  .nav-links a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:600}
  .nav-links a.active,.nav-links a:hover{color:var(--accent)}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px}
  h1{margin:0 0 4px;font-size:26px}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .date{color:var(--muted);font-size:13px;font-weight:600}
  .scoreline{display:flex;align-items:center;gap:16px;margin:12px 0 6px;flex-wrap:wrap}
  .team{font-weight:700;font-size:18px}
  .team.loser{color:var(--muted)}
  .score{font-size:26px;font-weight:800;letter-spacing:.5px}
  .win-tag{color:#22c55e;font-size:13px;font-weight:700}
  .pog{margin:14px 0 4px;padding:10px 12px;background:#141821;border:1px dashed var(--line);border-radius:10px;font-size:14px}
  .pog .star{color:var(--gold)}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .statbox{background:#12151c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
  .statbox b{display:block;margin-bottom:4px}
  .recap{margin-top:14px;color:#c3cad8;font-size:14.5px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .error{background:#2a1416;border:1px solid #5b1a20;color:#ffb4bd;padding:16px;border-radius:12px}
</style>
</head>
<body>
<div class="nav">
  <a class="brand" href="index.html">COBL × Street 11</a>
  <div class="nav-links">
    <a href="schedule.html">Schedule</a>
    <a href="results.html" class="active">Results</a>
    <a href="standings.html">Standings</a>
    <a href="season.html">Season Races</a>
    <a href="players.html">Players</a>
  </div>
</div>
<div class="wrap">
  <h1>Game Summary &amp; Results</h1>
  <p class="sub">Final scores, player stats, and shareable game recaps.</p>
  <div id="app">Loading…</div>
</div>
<script src="js/livestats-adapter.js"></script>
<script src="js/app.js"></script>
<script>
(async function(){
  const root = document.getElementById('app');
  let games;
  try { games = await loadGames(); }
  catch (e) { root.innerHTML = '<div class="error">Could not load game data. Make sure data/games.json and data/incoming/index.json exist. ' + esc(e.message) + '</div>'; return; }

  const finals = games.filter(g => g.status === 'final' && g.homeScore != null && g.awayScore != null)
                      .sort((a,b) => b.date.localeCompare(a.date));
  if (!finals.length){ root.innerHTML = '<div class="empty">No final games yet.</div>'; return; }
  root.innerHTML = finals.map(renderGameCard).join('');

  if (location.hash){
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el){ setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 50);
             el.style.outline = '3px solid var(--gold)'; el.style.outlineOffset = '4px'; }
  }

  function renderGameCard(g){
    const homeWon = g.homeScore > g.awayScore;
    const winner = homeWon ? g.home : g.away;
    const pog = g.playerOfTheGame ? `<div class="pog">
      <span class="star">★</span> <strong>${esc(g.playerOfTheGame.team)}</strong> —
      #${g.playerOfTheGame.number} ${esc(g.playerOfTheGame.name)}
      <span style="color:var(--muted)"> · ${g.playerOfTheGame.line.pts} PTS,
      ${g.playerOfTheGame.line.reb} REB, ${g.playerOfTheGame.line.ast} AST,
      ${g.playerOfTheGame.line.eff} EFF</span></div>` : '';

    const box = (g.boxScore||[]).length ? `<table>
      <thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>EFF</th></tr></thead>
      <tbody>${g.boxScore.map(p => `<tr>
        <td>#${p.number} ${esc(p.name)}${p.isRookie?' <span style="color:var(--gold)">R</span>':''}</td>
        <td>${p.min ?? '—'}</td><td>${p.pts ?? '—'}</td><td>${p.reb ?? '—'}</td>
        <td>${p.ast ?? '—'}</td><td>${p.stl ?? '—'}</td><td>${p.blk ?? '—'}</td><td>${p.eff ?? '—'}</td>
      </tr>`).join('')}</tbody></table>` : '';

    const teamStats = g.teamStats ? `<div class="stats">${Object.entries(g.teamStats).map(([team, s]) =>
      `<div class="statbox"><b>${esc(team)}</b>FG ${s.fgPct}% · REB ${s.reb} · AST ${s.ast}</div>`).join('')}</div>` : '';

    return `<article class="card" id="${esc(g.id)}">
      <div class="head"><div class="date">${esc(fmtDate(g.date))} · W: ${esc(winner)}</div></div>
      <div class="scoreline">
        <span class="team ${homeWon?'':'loser'}">${esc(g.home)}</span>
        <span class="score">${g.homeScore} – ${g.awayScore}</span>
        <span class="team ${homeWon?'loser':''}">${esc(g.away)}</span>
        <span class="win-tag">✓ ${esc(winner)}</span>
      </div>
      ${pog}${box}${teamStats}
      ${g.recap ? `<p class="recap">${esc(g.recap)}</p>` : ''}
    </article>`;
  }
})();
</script>
</body>
</html>
