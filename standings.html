<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standings | COBL x Street 11 Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#0b1330;--muted:#4b5575;--blue:#1b3fd8;--yellow:#ffd60a;--line:#dde2f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b1f;--surface:#0f1633;--text:#f4f6ff;--muted:#a8b2d6;--line:#222c57;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(135deg,#0a1f8f,#06116b);color:#fff;padding:28px 0 34px}
.hero a{color:#fff;text-decoration:none;font-size:14px;opacity:.85}
.hero h1{font-size:clamp(40px,9vw,72px);line-height:1;margin-top:14px}
.hero h1 span{color:var(--yellow)}
.hero p{margin:8px 0 0;opacity:.9}
.tw{overflow-x:auto;margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:11px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
td.tm,th.tm{text-align:left}
td.rk{font-family:Anton,Impact,sans-serif;font-size:18px;width:38px;color:var(--muted)}
tr.cut td{border-bottom:3px dashed var(--yellow)}
td.pct{font-weight:600}
tr.out{opacity:.65}
.tmc{display:flex;align-items:center;gap:10px;font-weight:600}
.lgw{position:relative;width:38px;height:38px;flex:0 0 38px}
.lgw .bd{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5);border:1px solid rgba(128,128,128,.5)}
.lgw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%;border:1px solid var(--line)}
.note{color:var(--muted);font-size:13px;margin:12px 0}
h2{font-size:26px;margin:30px 0 10px}
.res{display:grid;gap:8px;padding-bottom:50px}
.rr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rr .s{display:flex;align-items:center;gap:8px;font-weight:600;flex:1;min-width:0}
.rr .s:last-child{justify-content:flex-end;text-align:right}
.rr b.w{color:var(--blue)}
@media (prefers-color-scheme:dark){.rr b.w{color:var(--yellow)}}
.rr .sc{font-family:Anton,Impact,sans-serif;font-size:22px}
@media (max-width:640px){.wrap{padding:0 14px}th,td{padding:10px 7px}.rr .s span.n{display:none}}
footer{text-align:center;padding:26px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer a{color:inherit}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><a href="index.html">&larr; COBL x Street 11 Basketball</a><h1>Season 3 <span>Standings</span></h1><p>Round-robin standings. The top 8 teams advance to the playoffs.</p></div></header>
<main class="wrap">
  <div class="tw"><table><thead><tr><th>#</th><th class="tm">Team</th><th>GP</th><th>W</th><th>L</th><th>PCT</th><th>PF</th><th>PA</th><th>DIFF</th></tr></thead><tbody id="body"></tbody></table></div>
  <p class="note" id="note">Standings update after every game. The season starts soon.</p>
  <h2>Recent Results</h2>
  <div class="res" id="res"><div class="note">No games played yet.</div></div>
</main>
<footer>&copy; 2026 COBL Committee &middot; <a href="index.html">Home</a></footer>
<script>
const COL={1:'#1f9d55',2:'#111111',3:'#9ca3af',4:'#2563eb',5:'#f97316',6:'#dc2626',7:'#eab308',8:'#6b7280',9:'#0d9488',10:'#7c3aed',11:'#7f1d1d'};
let NAMES={},GAMES=[];
const nm=t=>NAMES[t]||'Team '+t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function logo(t){return '<span class="lgw"><span class="bd" style="background:'+COL[t]+'">'+t+'</span><img src="logos/team-'+t+'.png" alt="" loading="lazy" onerror="this.remove()"></span>'}
function standings(){
  const S={};for(let t=1;t<=9;t++)S[t]={t:t,gp:0,w:0,l:0,pf:0,pa:0};
  const res=[];
  GAMES.forEach(gm=>{
    const by={};(gm.rows||[]).forEach(r=>{if(!r.team)return;by[r.team]=(by[r.team]||0)+(+r.pts||0)});
    const k=Object.keys(by);if(k.length!==2)return;
    const a=+k[0].replace(/\D/g,''),b=+k[1].replace(/\D/g,''),sa=by[k[0]],sb=by[k[1]];
    [a,b].forEach(t=>{if(!S[t])S[t]={t:t,gp:0,w:0,l:0,pf:0,pa:0}});
    S[a].gp++;S[b].gp++;S[a].pf+=sa;S[a].pa+=sb;S[b].pf+=sb;S[b].pa+=sa;
    if(sa>sb){S[a].w++;S[b].l++}else if(sb>sa){S[b].w++;S[a].l++}
    res.push({a:a,b:b,sa:sa,sb:sb});
  });
  const L=Object.values(S);
  L.forEach(x=>{x.pct=x.w+x.l?x.w/(x.w+x.l):0;x.diff=x.pf-x.pa});
  L.sort((x,y)=>(y.pct-x.pct)||(y.diff-x.diff)||(y.pf-x.pf)||(x.t-y.t));
  return {L:L,res:res};
}
function loadAll(cb){
  Promise.all([
    fetch('teams.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch('season-stats.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(v=>{
    if(v[0]&&v[0].teams)v[0].teams.forEach(x=>{if(x.id&&x.name)NAMES[x.id]=x.name});
    if(v[1]&&v[1].games)GAMES=v[1].games;
    cb();
  });
}

function render(){
  const o=standings(),L=o.L,any=L.some(x=>x.gp>0);
  document.getElementById('body').innerHTML=L.map((x,i)=>'<tr class="'+(i===7&&any?'cut':'')+(any&&i>=8?' out':'')+'"><td class="rk">'+(i+1)+'</td><td class="tm"><span class="tmc">'+logo(x.t)+esc(nm(x.t))+'</span></td><td>'+x.gp+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td class="pct">'+x.pct.toFixed(3).replace(/^0/,'')+'</td><td>'+x.pf+'</td><td>'+x.pa+'</td><td>'+(x.diff>0?'+':'')+x.diff+'</td></tr>').join('');
  document.getElementById('note').textContent=any?'Ranked by win percentage, then point difference, then points scored. The dashed line marks the top 8 who advance to the playoffs.':'Standings update after every game. The season starts soon.';
  if(o.res.length)document.getElementById('res').innerHTML=o.res.slice().reverse().slice(0,10).map(r=>'<div class="rr"><span class="s">'+logo(r.a)+'<span class="n">'+esc(nm(r.a))+'</span></span><span class="sc"><b class="'+(r.sa>r.sb?'w':'')+'">'+r.sa+'</b> - <b class="'+(r.sb>r.sa?'w':'')+'">'+r.sb+'</b></span><span class="s">'+'<span class="n">'+esc(nm(r.b))+'</span>'+logo(r.b)+'</span></div>').join('');
}
loadAll(render);
</script>
</body>
</html>
